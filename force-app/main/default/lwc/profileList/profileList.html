<template>
    <lightning-card title="Organization Profiles" icon-name="standard:profile">
        <div class="slds-var-m-around_medium">
            <lightning-spinner 
                if:true={isLoading} 
                alternative-text="Loading profiles..."
                size="small">
            </lightning-spinner>
            
            <template if:false={isLoading}>
                <template if:true={profiles}>
                    <lightning-datatable
                        key-field="profileId"
                        data={profiles}
                        columns={columns}
                        hide-checkbox-column>
                    </lightning-datatable>
                </template>
                
                <template if:false={profiles}>
                    <p class="slds-text-color_weak">No profiles found.</p>
                </template>
            </template>
            
            <template if:true={error}>
                <lightning-alert
                    type="error"
                    title="Error Loading Profiles"
                    message={error}
                    closable>
                </lightning-alert>
            </template>
        </div>
    </lightning-card>
</template>
